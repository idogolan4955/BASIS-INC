# BASIS AI: the staff assistant. A thread is one person's conversation; its
# messages are the exact content exchanged with the model, kept so a thread
# can be resumed append-only. The assistant reads through the connector as the
# person and never changes anything itself: every change it wants is an
# action that waits for that person's approval, then runs the platform's own
# function as them.

type AssistantThread @table {
  owner: User!
  title: String! @col(dataType: "varchar(160)")
  createdAt: Timestamp! @default(expr: "request.time")
  lastActivityAt: Timestamp! @default(expr: "request.time")
  archivedAt: Timestamp
}

enum AssistantMessageRole {
  user
  assistant
}

type AssistantMessage @table {
  thread: AssistantThread!
  # Order within the thread, from 1.
  seq: Int!
  role: AssistantMessageRole!
  # The content blocks as sent to or received from the model, unchanged.
  content: Any!
  # Set on assistant messages: model, stop reason, token usage.
  meta: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

enum AssistantActionState {
  proposed
  rejected
  executed
  failed
}

type AssistantAction @table {
  thread: AssistantThread!
  # The tool call that proposed it.
  toolUseId: String! @col(dataType: "varchar(80)")
  command: String! @col(dataType: "varchar(80)")
  input: Any!
  summary: String!
  state: AssistantActionState!
  decidedBy: User
  decidedAt: Timestamp
  result: Any
  error: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------- the assistant on the site
# (docs/CUSTOMER_PORTAL_PLAN.md §9). A conversation on the public site is a
# visitor's, held by a key only their browser has (stored as its hash), or a
# signed-in customer's. Turns are kept as exchanged with the model; actions
# (a sample request, a hand-off to sales, an answer to a quote) wait for the
# visitor's click, then run the same path as the site's own forms.

enum SiteAudience {
  anonymous
  customer
}

type SiteConversation @table {
  audience: SiteAudience!
  account: CustomerAccount
  uid: String @col(dataType: "varchar(128)")
  # Anonymous: the SHA-256 of the key the browser holds; never the key itself.
  sessionHash: String @col(dataType: "varchar(64)")
  # The SHA-256 of the visitor's address, for the hourly limit; never the address.
  ipHash: String @col(dataType: "varchar(64)")
  language: String @col(dataType: "varchar(16)")
  handedOffAt: Timestamp
  inquiry: Inquiry
  createdAt: Timestamp! @default(expr: "request.time")
  lastActivityAt: Timestamp! @default(expr: "request.time")
}

type SiteTurn @table {
  conversation: SiteConversation!
  seq: Int!
  role: AssistantMessageRole!
  content: Any!
  model: String @col(dataType: "varchar(40)")
  inputTokens: Int
  outputTokens: Int
  cachedTokens: Int
  createdAt: Timestamp! @default(expr: "request.time")
}

type SiteAction @table {
  conversation: SiteConversation!
  toolUseId: String! @col(dataType: "varchar(80)")
  # request_samples | talk_to_sales | answer_quote
  kind: String! @col(dataType: "varchar(24)")
  input: Any!
  summary: String!
  state: AssistantActionState!
  result: Any
  error: String
  decidedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}
