# ---------------------------------------------------------------- the owner's

query ListMailRules @auth(expr: "auth.token.role == 'owner'") {
  mailRules(where: { archivedAt: { isNull: true } }, orderBy: { sort: ASC }, limit: 500) {
    id
    match
    category
    audience
    ownerRole
    skipModel
    ignore
    sort
    createdAt
  }
}

query ListMailMailboxes @auth(expr: "auth.token.role == 'owner' || auth.token.role == 'operations'") {
  mailMailboxes(limit: 10) {
    id
    address
    provider
    state
    historyId
    watchExpiresAt
    lastSyncAt
    lastError
    createdAt
  }
}
