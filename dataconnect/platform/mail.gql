# Module 19, Mail. One set of reads per audience: Data Connect checks @auth
# per operation, so the audience filter lives in the query and a role can only
# call the reads for the audiences it may see (MAIL_AUDIENCE_READERS in
# packages/shared/src/mail.ts). The five blocks differ only in the audience and
# its roles; keep them identical otherwise. Writes go through the mail functions.

# ---------------------------------------------------------------- general

query ListMailGeneral @auth(expr: "auth.token.role == 'owner' || auth.token.role == 'operations' || auth.token.role == 'purchasing' || auth.token.role == 'qc' || auth.token.role == 'logistics' || auth.token.role == 'sales' || auth.token.role == 'marketing' || auth.token.role == 'finance'") {
  mailMessages(where: { audience: { eq: general } }, orderBy: { sentAt: DESC }, limit: 500) {
    id
    direction
    fromAddress
    fromName
    subject
    snippet
    sentAt
    state
    category
    ownerRole
    audience
    attachmentCount
    company {
      id
      legalName
      tradingName
    }
    contact {
      id
      name
    }
    thread {
      id
      messageCount
      mailLinks_on_thread(limit: 20) {
        entityType
        entityId
      }
    }
    mailActions_on_message(where: { state: { eq: proposed } }, limit: 20) {
      id
    }
  }
}

query GetMailGeneral($id: UUID!) @auth(expr: "auth.token.role == 'owner' || auth.token.role == 'operations' || auth.token.role == 'purchasing' || auth.token.role == 'qc' || auth.token.role == 'logistics' || auth.token.role == 'sales' || auth.token.role == 'marketing' || auth.token.role == 'finance'") {
  mailMessages(where: { id: { eq: $id }, audience: { eq: general } }, limit: 1) {
    id
    direction
    fromAddress
    fromName
    to
    cc
    replyTo
    subject
    sentAt
    receivedAt
    bodyText
    hasHtml
    state
    category
    ownerRole
    audience
    flags
    handledAt
    mailbox {
      address
      provider
    }
    company {
      id
      legalName
      tradingName
      companyRoles_on_company {
        kind
      }
    }
    contact {
      id
      name
      email
    }
    mailAttachments_on_message(orderBy: { position: ASC }, limit: 50) {
      id
      position
      filename
      mimeType
      sizeBytes
      document {
        id
        title
      }
    }
    mailClassifications_on_message(orderBy: { createdAt: DESC }, limit: 10) {
      id
      method
      category
      audience
      ownerRole
      basis
      summary
      summaryHe
      confidence
      createdAt
    }
    mailActions_on_message(orderBy: { createdAt: DESC }, limit: 50) {
      id
      kind
      targetType
      targetId
      payload
      state
      resultType
      resultId
      decidedAt
      dismissReason
      error
      version
    }
    thread {
      id
      subject
      messageCount
      lastInboundAt
      lastOutboundAt
      mailLinks_on_thread(limit: 50) {
        id
        entityType
        entityId
        basis
        createdAt
      }
      mailMessages_on_thread(where: { audience: { eq: general } }, orderBy: { sentAt: ASC }, limit: 100) {
        id
        direction
        fromAddress
        fromName
        snippet
        sentAt
      }
    }
  }
}

query ListMailForGeneral($entityType: String!, $entityId: String!) @auth(expr: "auth.token.role == 'owner' || auth.token.role == 'operations' || auth.token.role == 'purchasing' || auth.token.role == 'qc' || auth.token.role == 'logistics' || auth.token.role == 'sales' || auth.token.role == 'marketing' || auth.token.role == 'finance'") {
  mailLinks(where: { entityType: { eq: $entityType }, entityId: { eq: $entityId }, thread: { audience: { eq: general } } }, limit: 200) {
    id
    basis
    thread {
      id
      subject
      lastAt
      messageCount
      mailMessages_on_thread(orderBy: { sentAt: DESC }, limit: 1) {
        id
        direction
        fromAddress
        fromName
        snippet
        sentAt
      }
    }
  }
}

